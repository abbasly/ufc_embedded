[project]
name = "ufc_embedded"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anar Abbas", email = "anar.abbasly@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ufc_embedded = "ufc_embedded:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nbconvert>=7.17.2",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-networkx>=3.6.1.20261031",
]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
