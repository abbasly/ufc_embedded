name: Data refresh

# Rebuilds the site's data from the latest public datasets, without anyone running anything:
# fighter records, Elo and Glicko ratings, the style map, MMA math, predictions and upcoming
# odds. The model's weights stay as trained (fit on fights before 2024); what moves is every
# fighter's stats as of the latest card.
#
# Mondays, once the weekend's card is in the datasets, and Thursdays, for fresh odds before the
# next one. Nothing goes live unless the new data passes check_data.py and the tests.

on:
  schedule:
    - cron: "23 8 * * 1,4"
  workflow_dispatch: # "Run workflow" button, e.g. straight after a card

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write # commit the new data
  actions: write # start the deploy

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: scripts/download-data.sh
      - name: Keep the current data to compare against
        run: cp -R web/public/data "$RUNNER_TEMP/current-data"
      - name: Rebuild
        run: |
          uv run python -m ufc_embedded.export
          uv run python -m ufc_embedded.train --wandb disabled
      - name: Check the new data
        id: check
        run: |
          line="$(uv run python -m ufc_embedded.check_data "$RUNNER_TEMP/current-data" web/public/data)"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - run: uv run pytest
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add web/public/data data/processed/fighter_photos.json data/processed/fighter_photos_search.json
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh fighters, ratings and predictions"
          # Training also redraws docs/model-comparison.png; only the data is published.
          git restore .
          git pull --rebase origin master
          git push origin master
          # A push made with this workflow's token doesn't start other workflows: ask for the
          # deploy explicitly.
          gh workflow run ci.yml --ref master
      # What happened goes in the change log too (the admin panel, or supabase/queries/log.sql).
      # A logging hiccup never fails the refresh.
      - name: Log the refresh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LINE: ${{ steps.check.outputs.line }}
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v detail="$LINE" <<'SQL' || echo "couldn't log"
          insert into public.pickem_log (kind, detail) values ('data refresh', :'detail');
          SQL
      - name: Log a failed refresh
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v detail="$RUN_URL" <<'SQL' || echo "couldn't log"
          insert into public.pickem_log (kind, detail) values ('data refresh FAILED', :'detail');
          SQL
