name: CI

on:
  push:
    branches: [master, beta] # beta: tests only; only master deploys
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # The site's data lives in a GitHub Release, not in git (some tests read it).
      - run: node web/scripts/fetch-data.mjs
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  # The accounts database (supabase/migrations) and its row level security: applied to a
  # throwaway Postgres (preinstalled on the runner) and checked with supabase/tests.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH" supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The site's data lives in a GitHub Release, not in git: the tests and the build need it.
      - run: npm run data
      - run: npm test
      # Served from the custom domain in the SITE_DOMAIN repo variable if set
      # (Settings -> Secrets and variables -> Actions -> Variables), else https://<user>.github.io/<repo>/
      # Google AdSense is on only while the ADSENSE_CLIENT variable is set (ca-pub-...).
      - run: npm run build
        env:
          VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          VITE_VISITS_URL: ${{ vars.VISITS_URL }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
          # Accounts (src/backend): on only once both are set. The anon key is public by design;
          # the service-role key never goes into the site.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          BASE_PATH: ${{ vars.SITE_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_SITE_URL: ${{ vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [python, web, database]
    runs-on: ubuntu-latest
    # One Pages deployment at a time: a newer push cancels a deploy that's still running
    # (Pages refuses a new deployment while an older one is stuck in progress).
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
